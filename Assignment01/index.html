<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Grade Calculator</h1>
        <label for="numSubjects">Number of Subjects:</label>
        <input type="number" id="numSubjects" min="1" max="10">
        <button id="generateInputs">Generate Input Fields</button>
        <div id="marksInputs"></div>
        <button id="calculate">Calculate Grade</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
